name: Ultimate validation

on:
  push:
    branches: [aidsu/windows-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultimate-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Enable Windows symbolic links and long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1
          git config --global core.longpaths true
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Select Windows race compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $raceCompiler = Join-Path $env:MSYS2_ROOT 'ucrt64/bin/gcc.exe'
          "CC=$raceCompiler" >> $env:GITHUB_ENV
          'CGO_ENABLED=1' >> $env:GITHUB_ENV
          (Split-Path $raceCompiler) >> $env:GITHUB_PATH
          & $raceCompiler --version
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Vet
        if: ${{ !cancelled() }}
        working-directory: backend
        run: go vet ./...
      - name: Verify short root refusal and native deep file operations
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        working-directory: backend
        run: go test -count=1 -run '^TestWorkspaceIntegrationChineseLong(File)?Paths$' ./internal/adapters/workspace/gitworktree
      - name: Complete backend suite with race detection
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          skip_global_compinit: "1"
        shell: pwsh
        run: |
          . ../scripts/ultimate/prepare-windows-test-process.ps1
          go test -race -json -count=1 -timeout=40m ./... 2>&1 | Tee-Object backend-results.jsonl
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-results-${{ runner.os }}
          path: backend/backend-results.jsonl
      - name: Check generated API
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          go generate ./internal/httpd/apispec/...
          git diff --exit-code -- internal/httpd/apispec/openapi.yaml
      - name: Check generated SQL
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/storage/sqlite/gen
      - name: Complete static analysis
        if: ${{ !cancelled() }}
        working-directory: backend
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --path-mode=abs
  frontend:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Enable Windows symbolic links
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: packages/product-ui
      - run: npm ci
        working-directory: packages/cloud-client
      - name: Typecheck
        run: npm run frontend:typecheck
      - name: Shared packages and browser test types
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/cloud-client run build
          npm --prefix packages/cloud-client test
          npm --prefix packages/product-ui run build
          npm --prefix packages/product-ui test
          npm --prefix frontend run typecheck:e2e
      - name: Complete frontend suite
        if: ${{ !cancelled() }}
        env:
          TZ: UTC
        run: npm --prefix frontend test -- --reporter=default --reporter=json --outputFile=frontend-results.json
      - name: Prepare pinned browser runtime for native compatibility checks
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run browser-runtime:prepare
      - name: Native browser compatibility
        if: ${{ !cancelled() }}
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          browser_binary="$PWD/agent-browser/agent-browser.exe"
          AO_AGENT_BROWSER_TEST_BINARY="$browser_binary" npm test -- src/main/agent-browser-runtime.test.ts
      - name: Check API types
        if: ${{ !cancelled() }}
        run: |
          npm run api:ts
          git diff --exit-code -- frontend/src/api/schema.ts
      - name: Install browser for renderer checks
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Renderer interaction suite
        if: ${{ !cancelled() }}
        working-directory: frontend
        env:
          CI: "true"
          AO_E2E_PORT: "5187"
          PLAYWRIGHT_JSON_OUTPUT_NAME: renderer-results.json
        run: npm run test:e2e:renderer -- --reporter=line,json
      - uses: actions/setup-go@v5
        if: ${{ !cancelled() }}
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Real Electron daemon origin boundaries
        if: ${{ !cancelled() }}
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          electron_binary="$(node -p "require('../frontend/node_modules/electron')")"
          export AO_BOUNDARY_ELECTRON="$electron_binary"
          export AO_MOBILE_CONTROL_ELECTRON="$electron_binary"
          export AO_MUX_ELECTRON="$electron_binary"
          go test -count=1 -run '^Test(BrowserBoundary|MobileControlOrigin|MuxOrigin)Electron$' ./internal/httpd
      - name: Guarded browser navigation integration
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run test:browser-postcondition-integration
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-results-${{ runner.os }}
          path: |
            frontend/frontend-results.json
            frontend/renderer-results.json
            frontend/test-results
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build unsigned Windows installer
        working-directory: frontend
        env:
          CGO_ENABLED: "0"
        run: |
          npm ci --prefix ../packages/product-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run make
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out/make -Recurse -Filter *.exe | Get-FileHash -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: ai-dev-studio-ultimate-windows-x64
          path: frontend/out/make/**/*.exe
          if-no-files-found: error
